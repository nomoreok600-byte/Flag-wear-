name: Build Flag Wars Executable

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Front-End (Vite)
        run: npm run build

      - name: Bundle Full-Stack Server
        run: npx esbuild server.ts --bundle --platform=node --outfile=server.cjs

      - name: Compile Windows Standalone Executable (flag.exe)
        run: npx pkg server.cjs --targets node18-win-x64 --output flag.exe

      - name: Upload flag.exe Release Artifact
        uses: actions/upload-artifact@v3
        with:
          name: FlagWars-Caster-Executable
          path: flag.exe
