name: Build Flag Wars Executable

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Front-End (Vite)
        run: npm run build

      - name: Bundle Full-Stack Server
        run: npx esbuild server.ts --bundle --platform=node --packages=external --outfile=server.cjs

      - name: Compile Windows Standalone Executable (flag.exe)
        run: npx pkg server.cjs --targets node18-win-x64 --output flag.exe

      - name: Upload flag.exe Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlagWars-Caster-Executable
          path: flag.exe
